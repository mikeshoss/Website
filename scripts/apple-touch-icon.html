<!doctype html>
<!--
  Source for the raster icons: public/apple-touch-icon.png (180x180, the icon
  iOS uses when the site is saved to a home screen, and which some link
  unfurlers fall back to) and the PNG favicons for browsers that skip SVG.

  It is the key: the signal M on signal orange, the same drawing as public/favicon.svg.
  Drawn full-bleed and square, because iOS and Android apply their own corner
  mask; a rounded corner here would show as a light edge inside theirs.

  The SVG scales to whatever viewport generate-images.mjs sets, so one source
  serves every size. Regenerate with `npm run images`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: #e0520f; }
      svg { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" fill="#e0520f" />
      <path d="M5.4 20.8l4-11.2c.3-.9 1.1-.9 1.4 0L16 19.2l5.2-9.6c.3-.9 1.1-.9 1.4 0l4 11.2" fill="none" stroke="#1b1a18" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
  </body>
</html>
