<!doctype html>
<!--
  Source for every social card: public/og-image.png (the default) and the
  per-page cards in public/og/. One template, driven by the query string:

    ?eyebrow=Credits&title=If my name's on it, it's a *hit*.&sub=...&path=/credits

  *word* marks the one word set in signal orange, as on the site.

  Social platforms (LinkedIn, X, Facebook, Slack, iMessage) do not render SVG
  in og:image, so the shipped cards are PNGs. This page is the design; the
  PNGs are build artefacts. Regenerate after editing this file or the card
  list in scripts/generate-images.mjs:

    npm run images

  It renders at exactly 1200x630 — the size referenced by og:image:width and
  og:image:height in src/layouts/Layout.astro.

  Colours are the Tailwind theme tokens from tailwind.config.mjs (Braun
  palette): paper #edeae3, carbon #1b1a18, signal orange #e0520f, on-green
  #3f9a46.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        font-weight: 400;
        font-display: block;
        src: url('../node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 500;
        font-display: block;
        src: url('../node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        font-display: block;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        background: #edeae3;
        color: #1b1a18;
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 64px 72px 60px;
        display: flex;
        flex-direction: column;
      }

      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 17px;
        color: #77726a;
      }

      .marks { display: flex; justify-content: space-between; align-items: center; }
      .on { display: flex; align-items: center; gap: 12px; }
      .led { width: 13px; height: 13px; border-radius: 50%; background: #3f9a46; box-shadow: 0 0 0 5px rgb(63 154 70 / 0.18); }

      .body { flex: 1; display: flex; align-items: center; gap: 56px; }
      .copy { flex: 1; min-width: 0; }

      h1 {
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.02;
        font-size: var(--size, 76px);
        max-width: 15ch;
      }
      h1 em { font-style: normal; color: #e0520f; }

      .sub {
        margin-top: 26px;
        font-size: 27px;
        line-height: 1.35;
        color: #46433d;
        max-width: 30ch;
      }

      .grille {
        width: 230px;
        height: 230px;
        flex: none;
        border-radius: 40px;
        border: 2px solid #cfc9bd;
        background-image: radial-gradient(circle, #a9a397 2.3px, transparent 2.6px);
        background-size: 19px 19px;
        background-position: 6px 6px;
      }

      .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 26px; border-top: 2px solid #cfc9bd; }
      .tag { display: flex; align-items: center; gap: 16px; }
      .tag b { color: #1b1a18; font-weight: 400; }
      .cursor { display: inline-block; width: 0.55em; height: 1.25em; background: #e0520f; margin-left: 0.2em; vertical-align: -0.28em; }
      .path b { color: #1b1a18; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="marks mono">
      <span id="eyebrow">MS–01 · Milton, Ontario</span>
      <span class="on"><span class="led"></span> Building</span>
    </div>

    <div class="body">
      <div class="copy">
        <h1 id="title">I ship AI products in industries where being wrong is <em>expensive</em>.</h1>
        <p class="sub" id="sub" hidden></p>
      </div>
      <div class="grille" aria-hidden="true"></div>
    </div>

    <div class="foot mono">
      <span class="tag">
        <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="#1b1a18" stroke-width="2.2" />
          <path d="M12.5 23V9h5a4.2 4.2 0 010 8.4h-5" fill="none" stroke="#1b1a18" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <span>Produced by <b>Mike Shoss</b><span class="cursor"></span></span>
      </span>
      <span class="path" id="path"><b>mikeshoss.com</b></span>
    </div>

    <script>
      // Fill the card from the query string. Text is set with textContent and
      // only the *word* marker becomes an element, so no markup is injected.
      const q = new URLSearchParams(location.search);
      const set = (id, text) => { if (text) document.getElementById(id).textContent = text; };

      set('eyebrow', q.get('eyebrow'));

      const title = q.get('title');
      if (title) {
        const h1 = document.getElementById('title');
        h1.textContent = '';
        title.split(/(\*[^*]+\*)/).forEach(part => {
          if (/^\*[^*]+\*$/.test(part)) {
            const em = document.createElement('em');
            em.textContent = part.slice(1, -1);
            h1.append(em);
          } else {
            h1.append(part);
          }
        });
        // Long titles step down so they never run into the footer.
        const n = title.replace(/\*/g, '').length;
        h1.style.setProperty('--size', n > 60 ? '70px' : n > 34 ? '80px' : '96px');
      }

      const sub = q.get('sub');
      if (sub) {
        const el = document.getElementById('sub');
        el.textContent = sub;
        el.hidden = false;
      }

      const path = q.get('path');
      if (path && path !== '/') {
        const el = document.getElementById('path');
        el.textContent = '';
        const b = document.createElement('b');
        b.textContent = 'mikeshoss.com';
        el.append(b, path);
      }
    </script>
  </body>
</html>
