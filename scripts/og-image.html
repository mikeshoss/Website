<!doctype html>
<!--
  Source for public/og-image.png — the Open Graph / Twitter card image.

  Social platforms (LinkedIn, X, Facebook, Slack, iMessage) do not render SVG
  in og:image, so the shipped card has to be a raster file. This page is the
  design; the PNG is the build artefact. Regenerate after editing:

    npm run images

  It renders at exactly 1200x630 — the size referenced by og:image:width and
  og:image:height in src/layouts/Layout.astro. Changing the dimensions here
  means changing them there too.

  Colours are the Tailwind theme tokens from tailwind.config.mjs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        font-display: block;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        font-display: block;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        font-display: block;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        font-display: block;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      /*
        Anchored to the viewport rather than to fixed pixel dimensions: headless
        Chromium does not always give the document the exact --window-size, and
        a body sized in px then leaves an unpainted strip at the bottom of the
        screenshot. Filling the viewport makes the render size-agnostic — the
        PNG's dimensions come from --window-size alone.
      */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0a0a0a 0%, #0d1117 55%, #131b2e 100%);
        font-family: 'Inter', system-ui, sans-serif;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      /* Faint grid, echoing the site's engineered feel without competing with the type. */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* Accent bloom behind the top-right corner. */
      .bloom {
        position: absolute;
        top: -220px;
        right: -160px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.20) 0%, rgba(139, 92, 246, 0.10) 45%, transparent 70%);
      }

      .content { position: relative; }

      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #3b82f6;
        margin-bottom: 30px;
      }

      .name {
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
        margin-bottom: 26px;
      }

      .headline {
        font-size: 40px;
        font-weight: 600;
        line-height: 1.32;
        letter-spacing: -0.018em;
        max-width: 940px;
        background: linear-gradient(100deg, #ffffff 0%, #c7d2fe 55%, #a5b4fc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 34px;
      }

      .meta {
        font-size: 25px;
        font-weight: 400;
        color: #8b93a1;
        letter-spacing: -0.005em;
      }

      .meta strong { color: #d1d5db; font-weight: 600; }

      .rule {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="bloom"></div>

    <div class="content">
      <p class="eyebrow">mikeshoss.com</p>
      <h1 class="name">Mike Shoss</h1>
      <p class="headline">I ship AI products in industries where being wrong is expensive.</p>
      <p class="meta">
        Staff Product Manager at <strong>Clio</strong>
        &nbsp;·&nbsp; Founder of <strong>Epilogue</strong>
      </p>
    </div>

    <div class="rule"></div>
  </body>
</html>
